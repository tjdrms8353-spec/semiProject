server {
    listen 80;
    server_name onfit.duckdns.org;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://onfit.duckdns.org$request_uri; }
}

server {
    listen 443 ssl;
    server_name onfit.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/onfit.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onfit.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
    location = /health { proxy_pass http://api:8000; }
    location /assets/ { try_files $uri =404; }
    location /models/ { try_files $uri =404; }
    location /textures/ { try_files $uri =404; }
    location = /ai-fashion { try_files /index.html =404; }
    location = /ai-fashion/ { try_files /index.html =404; }
    location /ai-fashion/ { try_files $uri /index.html; }
    location / { try_files $uri $uri/ /index.html; }
}
